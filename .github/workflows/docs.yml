# Build the documentation website and publish it on Cloudflare Workers
# (static files only): https://libmat.ningnawang.workers.dev
#
# One-time setup: add the repository secrets CLOUDFLARE_API_TOKEN (an API
# token from the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
# The Worker itself is configured in wrangler.jsonc.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the API pages are generated from the python sources, no build needed
      - run: pip install mkdocs-material "mkdocstrings[python]" ruff
      - run: mkdocs build --strict
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
